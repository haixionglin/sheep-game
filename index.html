<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>赶羊游戏</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #7cc26b;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #hud {
    position: fixed;
    top: 16px;
    left: 0;
    right: 0;
    text-align: center;
    color: #fff;
    font-size: 19px;
    font-weight: 700;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35);
    pointer-events: none;
  }
  #resetBtn {
    position: fixed;
    bottom: 12px;
    right: 12px;
    padding: 6px 14px;
    border: none;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.6);
    color: #3a5a2a;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #banner {
    position: fixed;
    top: 38%;
    left: 0;
    right: 0;
    text-align: center;
    color: #fff;
    font-size: 52px;
    font-weight: 800;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
    pointer-events: none;
    opacity: 0;
  }
  #banner.play { animation: bannerFade 1.6s ease-out forwards; }
  @keyframes bannerFade {
    0%   { opacity: 0; transform: translateY(14px) scale(0.92); }
    15%  { opacity: 1; transform: none; }
    70%  { opacity: 1; }
    100% { opacity: 0; }
  }
  #hint {
    position: fixed;
    bottom: 56px;
    left: 16px;
    right: 16px;
    text-align: center;
    color: #fff;
    font-size: 16px;
    line-height: 1.5;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #hint.show { opacity: 1; }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.4);
    color: #fff;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h1 {
    margin: 0 0 12px;
    font-size: 54px;
    text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  }
  #overlay p {
    margin: 0 0 28px;
    font-size: 19px;
  }
  #nextBtn {
    padding: 12px 36px;
    border: none;
    border-radius: 999px;
    background: #ffb400;
    color: #5a3b00;
    font-size: 21px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 0 #c98a00;
  }
  #nextBtn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #c98a00;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<button id="resetBtn" type="button">重新开始</button>
<div id="banner"></div>
<div id="hint"></div>
<div id="overlay">
  <h1 id="overlayTitle"></h1>
  <p id="overlayText"></p>
  <button id="nextBtn" type="button"></button>
</div>

// 方向：0 上、1 右、2 下、3 左；每个方向对应的 [行变化, 列变化]
const DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]];
const ARROW_DIR = { '^': 0, '>': 1, 'v': 2, '<': 3 };
// 羊毛的圆圈（单位是“一格”的比例；羊先朝右画，再旋转到实际朝向）
const WOOL = [{ x: 0, y: 0, r: 0.2 }];
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
  WOOL.push({ x: Math.cos(a) * 0.19, y: Math.sin(a) * 0.16, r: 0.14 });
}

// 关卡的行列、羊数、栅栏数都从棋盘上数出来
for (const cfg of LEVELS) {
  cfg.rows = cfg.layout.length;
  cfg.cols = cfg.layout[0].length;
  cfg.sheep = cfg.layout.join('').replace(/[.#]/g, '').length;
  cfg.fences = cfg.layout.join('').replace(/[^#]/g, '').length;
}
const FIRST_WOLF_LEVEL = LEVELS.findIndex((c) => c.wolves && c.wolves.length) + 1;

// 矩形边缘，顺时针，从左上角开始（和设计工具里的顺序一致）
function perimeter(r1, c1, r2, c2) {
  const out = [];
  for (let c = c1; c <= c2; c++) out.push([r1, c]);
  for (let r = r1 + 1; r <= r2; r++) out.push([r, c2]);
  for (let c = c2 - 1; c >= c1; c--) out.push([r2, c]);
  for (let r = r2 - 1; r > r1; r--) out.push([r, c1]);
  return out;
}

const fmt = (t) => {
  const s = Math.floor(t);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const inside = (r, c) => r >= 0 && r < rows && c >= 0 && c < cols;

function showBanner(text) {
  banner.textContent = text;
  banner.classList.remove('play');
  void banner.offsetWidth;   // 强制重排，让动画能重新播放
  banner.classList.add('play');
}

// 从这一格朝 d 方向一直看到棋盘边缘：没有栅栏、没有羊、没有狼，才能冲出去
function rayClear(r, c, d) {
  const [dr, dc] = DIRS[d];
  for (let rr = r + dr, cc = c + dc; inside(rr, cc); rr += dr, cc += dc) {
    if (board[rr][cc] || wolfMap[rr * cols + cc]) return false;
  }
  return true;
}

// 现在有没有能冲出去的羊（没有的话，棋盘上还有羊就是走进了死路）
function anyTappable() {
  return sheepList.some((s) => rayClear(s.r, s.c, s.d));
}

// 把 layout 变成棋盘
function parseLayout(lines) {
  const grid = lines.map((line, r) => [...line].map((ch, c) => {
    if (ch === '#') return 'F';
    if (ch in ARROW_DIR) return { r, c, d: ARROW_DIR[ch], shake: 0 };
    return null;
  }));
  const list = [];
  for (const row of grid) {
    for (const v of row) {
      if (v && v !== 'F') list.push(v);
    }
  }
  return { grid, list };
}

// ---------- 狼 ----------
// 第 t 步时，狼在路线的第 (t + off) % 长度 个格子上
function refreshWolves(t, animate) {
  wolfMap = new Uint8Array(rows * cols);
  for (const w of wolves) {
    const idx = (t + w.off) % w.route.length;
    const [r, c] = w.route[idx];
    if (animate && w.cur) {
      w.from = w.cur;
      w.anim = 0;
    } else {
      w.from = [r, c];
      w.anim = 1;
    }
    w.idx = idx;
    w.cur = [r, c];
    wolfMap[r * cols + c] = 1;
  }
}

// 点羊：前面通畅就冲出去，被挡住就原地抖一下。冲出去以后狼走一步
function tapSheep(s) {
  if (!rayClear(s.r, s.c, s.d)) {
    s.shake = 0.4;
    return;
  }
  board[s.r][s.c] = null;        // 马上从棋盘移走，后面的羊立刻就能看到空位
  sheepList = sheepList.filter((o) => o !== s);
  if (hoverSheep === s) hoverSheep = null;
  const [dr, dc] = DIRS[s.d];
  dashers.push({ x: s.c + 0.5, y: s.r + 0.5, dx: dc, dy: dr, d: s.d, t: 0, dustT: 0 });
  turns++;
  refreshWolves(turns, true);
  // 狼走到的格子上还有没走的羊：羊被吃掉，输了
  for (const w of wolves) {
    const [r, c] = w.cur;
    if (board[r][c] && board[r][c] !== 'F') {
      loseLevel(r, c);
      return;
    }
  }
  saveGame();
}

function loseLevel(r, c) {
  state = 'lost';
  eaten = { r, c, t: 0 };
  clearTimeout(loseTimer);
  loseTimer = setTimeout(() => {
    showOverlay('被狼吃掉了', `第 ${level} 关失败了：狼踩到了还没走的羊。`, '重新开始本关', () => startLevel(null));
  }, 800);
}

// ---------- 画面 ----------
function spawnDust(x, y) {
  particles.push({
    x: x + (Math.random() - 0.5) * cell * 0.3,
    y: y + (Math.random() - 0.5) * cell * 0.1,
    vx: (Math.random() - 0.5) * cell * 0.4,
    vy: -(0.1 + Math.random() * 0.2) * cell,
    r: cell * (0.07 + Math.random() * 0.05),
    life: 0,
    max: 0.45 + Math.random() * 0.3,
  });
}

function updateDashers(dt) {
  for (const d of dashers) {
    d.t += dt;
    const speed = Math.min(18, 4 + d.t * 40);   // 每秒走几格：先慢后快
    d.x += d.dx * speed * dt;
    d.y += d.dy * speed * dt;
    d.dustT -= dt;
    if (d.dustT <= 0) {
      d.dustT = 0.08;
      spawnDust(ox + (d.x - d.dx * 0.3) * cell, oy + (d.y - d.dy * 0.3) * cell);
    }
  }
  // 整只羊都跑出棋盘外面了，就移除
  dashers = dashers.filter((d) => d.x > -1 && d.x < cols + 1 && d.y > -1 && d.y < rows + 1);
}

function updateParticles(dt) {
  for (const p of particles) {
    p.life += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.r += cell * 0.2 * dt;
  }
  particles = particles.filter((p) => p.life < p.max);
}

function update(dt) {
  if (state === 'playing') levelTime += dt;
  for (const s of sheepList) s.shake = Math.max(0, s.shake - dt);
  for (const w of wolves) if (w.anim < 1) w.anim = Math.min(1, w.anim + dt / 0.22);
  if (eaten) eaten.t += dt;
  updateDashers(dt);
  updateParticles(dt);

  // 棋盘上还有羊，但一只都走不了：走进了死路，只能重新开始本关
  if (state === 'playing' && dashers.length === 0 && sheepList.length > 0 && !anyTappable()) {
    state = 'stuck';
    clearTimeout(loseTimer);
    loseTimer = setTimeout(() => {
      showOverlay('没有能走的羊了', `第 ${level} 关走进了死路：剩下的羊都被挡住了。`, '重新开始本关', () => startLevel(null));
    }, 600);
  }

  // 最后一只羊跑出棋盘，就过关
  if (state === 'playing' && sheepList.length === 0 && dashers.length === 0) {
    state = 'cleared';
    totalTime += levelTime;
    saveGame();
    clearTimer = setTimeout(showClear, 600);
  }
}

function drawBoard() {
  const bw = cols * cell, bh = rows * cell;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
  ctx.fillRect(ox - 8, oy - 8, bw + 16, bh + 16);
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let r = 0; r <= rows; r++) {
    ctx.moveTo(ox, oy + r * cell);
    ctx.lineTo(ox + bw, oy + r * cell);
  }
  for (let c = 0; c <= cols; c++) {
    ctx.moveTo(ox + c * cell, oy);
    ctx.lineTo(ox + c * cell, oy + bh);
  }
  ctx.stroke();
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c] === 'F') {
        const p = cellCenter(r, c);
        drawFence(p.x, p.y);
      }
    }
  }
}

// 狼的巡逻路线：虚线
function drawWolfRoutes() {
  for (const w of wolves) {
    const pts = w.route.map(([r, c]) => cellCenter(r, c));
    ctx.save();
    ctx.strokeStyle = 'rgba(40, 40, 40, 0.3)';
    ctx.lineWidth = Math.max(1, cell * 0.05);
    ctx.setLineDash([cell * 0.14, cell * 0.14]);
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
}

// 鼠标移到羊上时，画出它会走的路：通畅是白点，被挡住是红色
function drawPath(s) {
  const clear = rayClear(s.r, s.c, s.d);
  const [dr, dc] = DIRS[s.d];
  for (let rr = s.r + dr, cc = s.c + dc; inside(rr, cc); rr += dr, cc += dc) {
    const p = cellCenter(rr, cc);
    const blocked = !!board[rr][cc] || !!wolfMap[rr * cols + cc];
    ctx.fillStyle = blocked ? 'rgba(229, 57, 53, 0.9)' : (clear ? 'rgba(255, 255, 255, 0.85)' : 'rgba(229, 57, 53, 0.6)');
    ctx.beginPath();
    ctx.arc(p.x, p.y, cell * 0.08, 0, Math.PI * 2);
    ctx.fill();
    if (blocked) break;
  }
}

// 狼当前位置（从上一格慢慢走到这一格）和朝向（朝着它下一步的方向）
function wolfDrawPos(w) {
  const k = w.anim * w.anim * (3 - 2 * w.anim);
  const fr = w.from, cu = w.cur;
  const r = fr[0] + (cu[0] - fr[0]) * k + 0.5;
  const c = fr[1] + (cu[1] - fr[1]) * k + 0.5;
  const nxt = w.route[(w.idx + 1) % w.route.length];
  const angle = Math.atan2(nxt[0] - cu[0], nxt[1] - cu[1]);
  return { x: ox + c * cell, y: oy + r * cell, angle };
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(grass, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawBoard();
  drawWolfRoutes();
  if (hoverSheep && state === 'playing' && board[hoverSheep.r][hoverSheep.c] === hoverSheep) {
    drawPath(hoverSheep);
  }

  ctx.fillStyle = '#f5f2e8';
  for (const p of particles) {
    ctx.globalAlpha = (1 - p.life / p.max) * 0.6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const s of sheepList) {
    const p = cellCenter(s.r, s.c);
    const shakePx = s.shake > 0 ? Math.sin(s.shake * 70) * cell * 0.08 * (s.shake / 0.4) : 0;
    drawSheepTop(p.x, p.y, s.d, shakePx);
    if (s.shake > 0) {
      ctx.strokeStyle = `rgba(229, 57, 53, ${s.shake / 0.4})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, cell * 0.46, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  for (const w of wolves) {
    const p = wolfDrawPos(w);
    drawWolfTop(p.x, p.y, p.angle);
  }
  if (eaten && eaten.t < 1.2) {
    const p = cellCenter(eaten.r, eaten.c);
    ctx.strokeStyle = `rgba(229, 57, 53, ${1 - eaten.t / 1.2})`;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, cell * (0.4 + eaten.t * 0.5), 0, Math.PI * 2);
    ctx.stroke();
  }
  for (const d of dashers) {
    drawSheepTop(ox + d.x * cell, oy + d.y * cell, d.d, 0);
  }
}

function cellCenter(r, c) {
  return { x: ox + (c + 0.5) * cell, y: oy + (r + 0.5) * cell };
}

// 找到被点中的羊（点的是哪一格）
function sheepAt(x, y) {
  const c = Math.floor((x - ox) / cell), r = Math.floor((y - oy) / cell);
  if (!inside(r, c)) return null;
  const v = board[r][c];
  return v && v !== 'F' ? v : null;
}

// 草地背景：每关换一次配色，每关只画一次，之后每帧直接贴图
function buildGrass() {
  const th = THEMES[LEVELS[level - 1].theme];
  grass = document.createElement('canvas');
  grass.width = canvas.width;
  grass.height = canvas.height;
  const g = grass.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const base = g.createLinearGradient(0, 0, 0, H);
  base.addColorStop(0, th.top);
  base.addColorStop(1, th.bottom);
  g.fillStyle = base;
  g.fillRect(0, 0, W, H);

  for (let i = 0; i < (W * H) / 9000; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.07)' : `rgba(${th.dark},0.10)`;
    g.beginPath();
    g.arc(Math.random() * W, Math.random() * H, 20 + Math.random() * 60, 0, Math.PI * 2);
    g.fill();
  }
  g.strokeStyle = `rgba(${th.dark},0.45)`;
  g.lineWidth = 2;
  g.lineCap = 'round';
  g.beginPath();
  for (let i = 0; i < (W * H) / 3000; i++) {
    const x = Math.random() * W, y = Math.random() * H, s = 4 + Math.random() * 4;
    g.moveTo(x - s, y); g.lineTo(x - s / 2, y - s);
    g.moveTo(x, y); g.lineTo(x, y - s * 1.5);
    g.moveTo(x + s, y); g.lineTo(x + s / 2, y - s);
  }
  g.stroke();
  for (let i = 0; i < (W * H) / 25000; i++) {
    g.fillStyle = Math.random() < 0.5 ? '#fff7b0' : '#ffffff';
    g.beginPath();
    g.arc(Math.random() * W, Math.random() * H, 2.5, 0, Math.PI * 2);
    g.fill();
  }
}

// 格子大小和棋盘位置：放得下就居中；放不下就靠左上，可以拖动
function layoutBoard() {
  const availW = W - 16, availH = H - TOP - BOTTOM;
  cell = Math.max(MIN_CELL, Math.min(availW / cols, availH / rows, MAX_CELL));
  clampCam(true);
}

function clampCam(reset) {
  const bw = cols * cell, bh = rows * cell, availH = H - TOP - BOTTOM;
  if (bw > W - 16) {
    ox = reset ? 8 : clamp(ox, W - 8 - bw, 8);
  } else {
    ox = (W - bw) / 2;
  }
  if (bh > availH) {
    oy = reset ? TOP : clamp(oy, H - BOTTOM - bh, TOP);
  } else {
    oy = TOP + (availH - bh) / 2;
  }
}

// ---------- 存档 ----------
// 存的是：关卡号、总用时、本关用时、剩下的羊和栅栏。狼的位置由“已经冲出去几只”算出来
function saveGame() {
  const fences = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c] === 'F') fences.push([r, c]);
    }
  }
  const data = {
    v: 1,
    level,
    totalTime,
    levelTime,
    cleared: state === 'cleared',
    fences,
    sheep: sheepList.map((s) => [s.r, s.c, s.d]),
  };
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) {
    // 浏览器不让存（比如隐私模式）就算了，游戏照常能玩
  }
}

function loadGame() {
  try {
    const data = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!data || data.v !== 1 || !LEVELS[data.level - 1]) return null;
    return data;
  } catch (e) {
    return null;
  }
}

// 把存档里的棋盘还原出来；存档有问题就返回 null，改为按设计重新开始这一关
function restoreBoard(data) {
  const cfg = LEVELS[data.level - 1];
  try {
    rows = cfg.rows;
    cols = cfg.cols;
    const grid = Array.from({ length: rows }, () => new Array(cols).fill(null));
    const okCell = (r, c) => Number.isInteger(r) && Number.isInteger(c) && r >= 0 && r < rows && c >= 0 && c < cols;
    for (const [r, c] of data.fences) {
      if (!okCell(r, c) || grid[r][c]) return null;
      grid[r][c] = 'F';
    }
    const list = [];
    for (const [r, c, d] of data.sheep) {
      if (!okCell(r, c) || grid[r][c] || !Number.isInteger(d) || d < 0 || d > 3) return null;
      const s = { r, c, d, shake: 0 };
      grid[r][c] = s;
      list.push(s);
    }
    board = grid;
    return list;
  } catch (e) {
    return null;
  }
}

// saved 有值时是续上次的进度，没有值就从这一关的设计开始
function startLevel(saved) {
  const cfg = LEVELS[level - 1];
  rows = cfg.rows;
  cols = cfg.cols;
  layoutBoard();
  buildGrass();
  let list = saved ? restoreBoard(saved) : null;
  if (!list) {
    const made = parseLayout(cfg.layout);
    board = made.grid;
    list = made.list;
  }
  sheepList = list;
  turns = cfg.sheep - sheepList.length;
  wolves = (cfg.wolves || []).map((w) => ({
    route: perimeter(...w.rect), off: w.off, cur: null, from: null, anim: 1, idx: 0,
  }));
  refreshWolves(turns, false);
  dashers = [];
  particles = [];
  hoverSheep = null;
  eaten = null;
  levelTime = saved ? (Number(saved.levelTime) || 0) : 0;
  state = 'playing';
  clearTimeout(clearTimer);
  clearTimeout(loseTimer);
  overlay.classList.remove('show');
  overlayAction = null;
  // 提示：第 1 关讲点羊；第一次出现狼的那一关讲狼
  hudText = '';
  let tip = '';
  if (level === 1) tip = '点小羊，它会朝自己面对的方向冲出去；被挡住的羊冲不出去';
  else if (level === FIRST_WOLF_LEVEL) tip = '狼会沿着虚线巡逻。你每冲出一只羊，狼就走一步；狼踩到还没走的羊，羊就被吃掉。';
  hint.textContent = tip;
  hint.classList.toggle('show', !!tip && !saved);
  showBanner(saved ? `继续第 ${level} 关` : `第 ${level} 关`);
  saveGame();
}

function showOverlay(title, text, btn, action) {
  overlayTitle.textContent = title;
  overlayText.textContent = text;
  nextBtn.textContent = btn;
  overlayAction = action;
  overlay.classList.add('show');
}

// 下一关；通关最后一关之后，再玩就从第 1 关重新开始
function advance() {
  if (state !== 'cleared') return;
  if (level < LEVELS.length) level++;
  else {
    level = 1;
    totalTime = 0;
  }
  startLevel(null);
}

// 重新开始：从第 1 关开始，原来的存档会被覆盖
function resetGame() {
  clearTimeout(clearTimer);
  clearTimeout(loseTimer);
  level = 1;
  totalTime = 0;
  startLevel(null);
}

function showClear() {
  if (level < LEVELS.length) {
    showOverlay('过关！', `第 ${level} 关用时 ${fmt(levelTime)}`, '下一关', advance);
  } else {
    showOverlay('全部通关！', `${LEVELS.length} 关全部通过，总用时 ${fmt(totalTime)}`, '再玩一次', resetGame);
  }
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  layoutBoard();
  buildGrass();
}

// 打开页面时：有存档就接着玩；上次那一关已经过了（只是没点下一关）就直接进下一关
function resumeOrStart() {
  const saved = loadGame();
  if (saved && saved.cleared) {
    level = saved.level + 1;
    totalTime = Number(saved.totalTime) || 0;
    if (!LEVELS[level - 1]) {
      level = 1;
      totalTime = 0;
    }
    startLevel(null);
  } else if (saved) {
    level = saved.level;
    totalTime = Number(saved.totalTime) || 0;
    startLevel(saved);
  } else {
    startLevel(null);
  }
}

function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);   // 切换标签页回来时别一下子跳太远
  last = now;
  update(dt);
  draw();

  const t = `第 ${level}/${LEVELS.length} 关　剩余 ${sheepList.length + dashers.length} 只　${fmt(levelTime)}`;
  if (t !== hudText) {
    hudText = t;
    hud.textContent = t;
  }
  requestAnimationFrame(loop);
}

// 指针：按下后移动超过 8px 就是拖动视野；松开时没有拖动，才算“点一下”
canvas.addEventListener('pointerdown', (e) => {
  hint.classList.remove('show');
  press = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, drag: false };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
});

canvas.addEventListener('pointermove', (e) => {
  if (press && e.pointerId === press.id) {
    const dx = e.clientX - press.lx, dy = e.clientY - press.ly;
    if (!press.drag && Math.hypot(e.clientX - press.sx, e.clientY - press.sy) > 8) press.drag = true;
    if (press.drag) {
      ox += dx;
      oy += dy;
      clampCam(false);
      hoverSheep = null;
    }
    press.lx = e.clientX;
    press.ly = e.clientY;
  } else {
    hoverSheep = state === 'playing' ? sheepAt(e.clientX, e.clientY) : null;
    canvas.style.cursor = hoverSheep ? 'pointer' : 'default';
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (press && e.pointerId === press.id) {
    if (!press.drag && state === 'playing') {
      const s = sheepAt(e.clientX, e.clientY);
      if (s) tapSheep(s);
    }
    press = null;
  }
});

canvas.addEventListener('pointercancel', () => { press = null; });

nextBtn.addEventListener('click', () => {
  if (overlayAction) overlayAction();
});

resetBtn.addEventListener('click', () => {
  if (confirm('要从第 1 关重新开始吗？现在的进度会被清除。')) resetGame();
});

window.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && overlay.classList.contains('show') && overlayAction) {
    e.preventDefault();
    overlayAction();
  }
});

// 每 5 秒存一次进度，关页面或切走时也存一次，用时才不会丢太多
setInterval(() => {
  if (state === 'playing') saveGame();
}, 5000);
window.addEventListener('pagehide', () => {
  if (state === 'playing') saveGame();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') saveGame();
});

window.addEventListener('resize', resize);

resize();
resumeOrStart();
requestAnimationFrame(loop);
</script>
</body>
</html>
